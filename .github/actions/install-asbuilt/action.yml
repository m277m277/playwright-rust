name: Install asbuilt
description: >
  Put the pinned asbuilt release on the PATH. The version here is the one
  place it is pinned: the model is a survey's output, so a different asbuilt
  can produce a different model, and CI, the pre-commit hook
  (scripts/asbuilt-check.sh reads this default) and every contributor must
  survey with the same release. Bumping it is a deliberate change that
  re-surveys the model in the same commit.

inputs:
  version:
    description: The asbuilt release to install from crates.io.
    required: false
    default: "0.2.0"

runs:
  using: composite
  steps:
    # rust-cache restores registries and target dirs, not ~/.cargo/bin, so
    # without this every run compiles asbuilt and its dependency tree from
    # source.
    - name: Cache the asbuilt binary
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/asbuilt
        key: ${{ runner.os }}-asbuilt-${{ inputs.version }}-v1

    - name: Install asbuilt
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install asbuilt --version ${{ inputs.version }} --locked

    # `validate`, `render` and `docs` run `npx likec4@<pinned>`; asbuilt pins
    # the LikeC4 version, so its own version keys the npm cache too, and the
    # package is downloaded once per asbuilt release rather than once per run.
    - name: Cache the pinned LikeC4 package
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-likec4-${{ inputs.version }}-v1

    - name: asbuilt version
      shell: bash
      run: asbuilt --version
